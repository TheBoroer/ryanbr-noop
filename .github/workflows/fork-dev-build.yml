# Fork-only: personal DEV build — auto-builds the Android APK on every push to `dev` and publishes
# it to a single rolling `dev-latest` prerelease (recreated in place, same pattern as
# fork-testing-build.yml's `testing-latest`). One stable download URL for the phone, always the
# newest dev build, zero cleanup.
#
# Android only (no macOS/iOS) so it stays fast (~5 min). Builds fullRelease -PstagingRelease —
# the SAME identity as upstream's testing builds (com.noop.whoop.staging), signed with the SAME
# committed android/fork-debug.keystore (byte-identical to upstream's), so this APK installs
# OVER an installed upstream staging build with all app data intact — and an upstream update
# installed later overwrites it right back. Never touches `testing-latest` or real releases.
name: Dev build (fork)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      # -PstagingRelease → .staging app id, same as upstream's testing builds (see build.gradle.kts);
      # release falls back to the committed debug key when no keystore.properties is present.
      - name: Build staging-release APK
        run: ./gradlew assembleFullRelease -PstagingRelease

      - name: Publish rolling dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-latest"
          DATE=$(date -u +%Y-%m-%d)
          SHA="${GITHUB_SHA:0:7}"
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          cp app/build/outputs/apk/full/release/*.apk "NOOP-android-dev-v${VER}.apk"
          # ROLLING release: recreate the single tag so stale assets never linger —
          # one stable URL, always the newest build. (To KEEP a build, cut a one-off tag.)
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "NOOP Dev — base ${VER} · ${DATE} · ${SHA}" \
            --notes "Rolling **dev** build — upstream main + my merged fixes (\`dev\` branch), refreshed on every push. Same identity + key as upstream's testing builds (\`com.noop.whoop.staging\`), so it installs **over** an existing staging install with app data intact — and upstream's next update overwrites it back.

          - **Android (staging release)** — \`NOOP-android-dev-v${VER}.apk\`

          Base app version ${VER} · built ${DATE} · \`${SHA}\`."
          gh release upload "$TAG" "NOOP-android-dev-v${VER}.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
