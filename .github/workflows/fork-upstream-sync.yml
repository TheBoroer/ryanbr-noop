# Fork-only: watches upstream (ryanbr/noop) for new releases and auto-merges them into `dev`.
#
# GitHub can't deliver webhooks from a repo you don't admin, and the `release:` trigger only
# fires for releases in THIS repo — so this polls upstream's latest release on a schedule
# instead (every 6 hours, plus manual dispatch).
#
# When a new upstream release tag appears that isn't already in `dev`, it merges the tag into
# `dev`, pushes, and explicitly dispatches fork-dev-build.yml (a push made with GITHUB_TOKEN
# doesn't trigger other workflows' `push:` events, so the dispatch is required — and it also
# means no double build).
#
# On a merge conflict the run does NOT fail. It aborts the merge and opens (or reuses) a single
# PR `upstream-sync/<tag>` -> `dev` so GitHub surfaces the conflict for web/local resolution,
# then exits green. This stops the 6-hourly cron from spamming a red run + failure email every
# 6h for the same unresolved tag. Resolve + merge the PR to complete the sync.
#
# NOTES:
#   - Scheduled workflows only run from the default branch. This fork's default branch is
#     `dev` (changed on purpose), so this file lives ONLY on dev — `main` stays byte-identical
#     to upstream, and PR branches cut from main/upstream never include it.
#   - GitHub auto-disables cron workflows after 60 days without repo activity; re-enable in
#     the Actions tab if that happens.
name: Upstream release sync (fork)

on:
  schedule:
    - cron: '23 */6 * * *' # every 6h (odd minute to dodge top-of-hour cron congestion)
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    # Fork-only guard — never run if this file somehow lands upstream.
    if: github.repository == 'TheBoroer/ryanbr-noop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Get latest upstream release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo ryanbr/noop --json tagName --jq .tagName)"
          echo "Latest upstream release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Merge release tag into dev if new
        id: merge
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/ryanbr/noop.git
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG"

          if git merge-base --is-ancestor "$TAG^{commit}" HEAD; then
            echo "Release $TAG already merged into dev — nothing to do."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Try a clean auto-merge first.
          if git merge --no-ff "$TAG" -m "Auto-merge upstream release $TAG into dev"; then
            git push origin dev
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Conflict: self-heal the noise, keep a human on the code. Abort so the tree is clean,
          # hand the merge off to a PR, and exit green so the cron stops failing every 6h.
          git merge --abort
          echo "merged=false" >> "$GITHUB_OUTPUT"

          branch="upstream-sync/$TAG"

          # Idempotent: if a PR for this tag is already open, there is nothing new to do.
          open_count="$(gh pr list --base dev --head "$branch" --state open --json number --jq 'length')"
          if [ "$open_count" != "0" ]; then
            echo "Conflict PR for $TAG already open ($branch) — leaving it for manual resolution."
            exit 0
          fi

          # Point a branch at the upstream tag commit and open a PR into dev. GitHub flags the
          # conflicts on the PR; resolving + merging it performs the sync.
          git push origin --force "$TAG^{commit}:refs/heads/$branch"
          body="$(printf '%s\n' \
            "Automated upstream sync could not cleanly merge \`$TAG\` into \`dev\`. There are conflicts." \
            "" \
            "**Resolve one of these ways:**" \
            "- GitHub's web resolver on this PR (fine for small/comment-level conflicts), or" \
            "- locally: \`git checkout dev && git fetch upstream && git merge $TAG\`, fix, then push." \
            "" \
            "Merging this PR completes the sync. Delete the \`$branch\` branch afterward." \
            "" \
            "_Opened by fork-upstream-sync.yml so the scheduled run stays green instead of failing every 6h._")"
          gh pr create \
            --base dev \
            --head "$branch" \
            --title "Merge upstream release $TAG into dev (conflicts)" \
            --body "$body"
          echo "Opened conflict PR for $TAG ($branch)."

      - name: Dispatch dev build
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fork-dev-build.yml --ref dev
